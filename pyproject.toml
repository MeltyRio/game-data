[project]
name = "game-data"
version = "0.1.0"
description = "Get and upload the game data to All The Ponies"
readme = "README.md"
authors = [
    { name = "ego-lay_atman-bay", email = "egolayatmanbay@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "argcomplete>=3.6.3",
    "boto3>=1.43.26",
    "google-play-scraper>=1.2.7",
    "luna-kit[all]",
    "pillow>=12.2.0",
    "playstoreapi",
    "pycairo>=1.29.0",
    "pydantic>=2.13.4",
    "pygobject>=3.56.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
game-data = "game_data:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
reinstall-package = ["luna-kit"]

[tool.uv.sources]
types-boto3-custom = { path = "vendored/types_boto3_custom-1.43.26-py3-none-any.whl" }
google-play-scraper = { git = "https://github.com/ego-lay-atman-bay/google-play-scraper" }
playstoreapi = { git = "https://github.com/ABhiTheModder/playstoreapi" }
luna-kit = { git = "https://github.com/ego-lay-atman-bay/luna-kit/", rev = "291fcc7b25bd8be1d78f93df4ec14025a41d04e9" }

[dependency-groups]
dev = [
    "moto[server]>=5.2.2",
    "pygobject-stubs>=2.17.0",
    "python-dotenv>=1.2.2",
    "types-boto3-custom",
    "types-lxml>=2026.2.16",
] 
